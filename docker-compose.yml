services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: credit_analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./database:/docker-entrypoint-initdb.d

  api:
    build: ./backend
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/credit_analytics
    depends_on:
      - db
    ports:
      - "3000:3000"
